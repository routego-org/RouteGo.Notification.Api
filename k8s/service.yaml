apiVersion: v1
kind: Service
metadata:
  name: notification
  labels: { app.kubernetes.io/name: notification, app.kubernetes.io/part-of: routego }
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: notification }
  ports:
    - { name: http, port: 80, targetPort: http }   # other services call http://notification/
