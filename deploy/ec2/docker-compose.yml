# EC2 deployment (routego-core). Run from this folder on the server:
#   docker compose up -d --build
# Needs a .env file next to this file (copy .env.example and fill it in).
# Real AWS is used here: SQS, SES and Secrets Manager through the EC2 instance role.
# Fixed project name, so the database volume stays the same on every deploy. It is "ec2" because
# that is the project the server already runs: it owns the ec2_postgres-data volume (Notification's
# and Identity's databases) and the ec2_default network the Identity and portal containers join.
# Renaming it would start a second, empty Postgres.
name: ec2
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: routego_notification
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # No "ports:" on purpose — the database is reachable only by the other containers.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d routego_notification"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot helper: applies the SQL migrations, then exits. It is not a long-running container.
  migrate:
    image: postgres:17
    command: ["bash", "/local/apply-migrations.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: routego_notification
      PGUSER: notification_user
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ../../migrations:/migrations:ro
      - ../../local/apply-migrations.sh:/local/apply-migrations.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  notification:
    build:
      context: ../..
    image: routego/notification:latest
    restart: unless-stopped
    ports:
      - "5007:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AWS_REGION: ap-south-1
      DB_CONNECTION_PROFILE: ManagedInstances
      DB_MAX_POOL_SIZE: "10"
      NotificationQueueUrl: ${NOTIFICATION_QUEUE_URL:?set NOTIFICATION_QUEUE_URL in .env}
      EmailServiceReportsQueueUrl: ${EMAIL_SERVICE_REPORTS_QUEUE_URL:?set EMAIL_SERVICE_REPORTS_QUEUE_URL in .env}
      SenderAddress: ${SENDER_ADDRESS:?set SENDER_ADDRESS in .env}
      SenderDisplayName: RouteGo
      PortalBaseUrl: ${PORTAL_BASE_URL:?set PORTAL_BASE_URL in .env}
      PortalSignInPath: /auth/login
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
